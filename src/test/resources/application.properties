spring.clients.user-service.name=user-service
spring.clients.user-service.url=http://localhost:8082
spring.clients.skill-service.name=skill-service
spring.clients.skill-service.url=http://localhost:8086
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=test-group
spring.kafka.topics.indexing-vacancy=indexing-vacancy
spring.vacancy-create.role=EMPLOYER
spring.data.redis.host=localhost
spring.data.redis.port=6379
management.health.redis.enabled=false
