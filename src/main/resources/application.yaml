server:
  port: 8083

spring:
  application:
    name: vacancy-service

  jackson:
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: localhost:9092
    topics:
      indexing-vacancy: indexing-vacancy
      vacancy-views: vacancy-views

  logging:
    level:
      org.springframework.cloud.gateway: INFO
      com.vlz: DEBUG

  clients:
    user-service:
      name: user-service
      url: http://localhost:8082
    skill-service:
      name: skill-service
      url: http://localhost:8086

  retry:
    max-attempts: 3
    delay: 1000

  vacancy-create:
    role: EMPLOYER

  datasource:
    url: jdbc:postgresql://localhost:5435/vacancydb
    username: vacancyuser
    password: vacancypass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: HikariPool-VacancyService
      leak-detection-threshold: 0

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          fetch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        generate_statistics: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  cache:
    type: redis
    redis:
      time-to-live: 3600000
      cache-null-values: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
    instances:
      userService:
        baseConfig: default
      vacancyService:
        baseConfig: default
        waitDurationInOpenState: 15s
      resumeService:
        baseConfig: default
      skillService:
        baseConfig: default
      companyService:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
        cancelRunningFuture: true
    instances:
      userService:
        baseConfig: default
      vacancyService:
        timeoutDuration: 5s
      resumeService:
        baseConfig: default
      skillService:
        timeoutDuration: 2s

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - feign.FeignException.ServiceUnavailable
          - java.net.ConnectException
    instances:
      userService:
        baseConfig: default
      vacancyService:
        baseConfig: default